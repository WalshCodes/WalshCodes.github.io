<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Luke Walsh | Software Developer</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;

            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            text-align: center;

        }
        .status-badge {
            display: inline-block;
            background-color: #e1e4e8;
            color: #24292e;

            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: bold;
            margin-top: 1rem;
        }
        .links {
            margin-top: 2rem;
        }
        a {
            color: #0366d6;
            text-decoration: none;
            font-weight: 500;
        }
        a:hover {
            text-decoration: underline;

    <div class="container">
